subject: the launch of a bike-sharing scheme in a mid-sized town
genre: blog post
audience: local residents
length_words: 450
language: en
facts:
  - 300 bikes, 120 of them electric
  - 42 docking stations across 6 neighbourhoods
  - annual pass costs 39 euros; without a pass, 1 euro per 30-minute ride
  - open 6 am to 11 pm, all year round
  - a 4-month trial with 900 users and 11,000 rides
  - main complaint during the trial was too few stations on the hills
