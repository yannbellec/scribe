subject: le lancement d'un service de vélos en libre-service dans une ville moyenne
genre: article de blog
audience: habitants de la ville
length_words: 450
facts:
  - 300 vélos dont 120 à assistance électrique
  - 42 stations réparties sur 6 quartiers
  - abonnement annuel à 39 euros, 1 euro le trajet de 30 minutes sans abonnement
  - service ouvert de 6 h à 23 h, toute l'année
  - phase de test de 4 mois avec 900 utilisateurs, 11 000 trajets
  - principale critique pendant le test : manque de stations sur les hauteurs
